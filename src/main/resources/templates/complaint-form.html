
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Complaint | HostelCare</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #f5f0ff;
            color: #35264d;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px #d9c9ed;
        }

        h1 {
            text-align: center;
            color: #7952a3;
        }

        p {
            text-align: center;
            color: #756781;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6c6e8;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #8961b3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #704696;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7952a3;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Register a Complaint</h1>
        <p>Tell us what needs attention in your hostel.</p>

        <form action="/complaints" method="post">

            <label for="title">Complaint Title</label>
            <input type="text" id="title" name="title"
                   placeholder="e.g. Water leakage in bathroom"
                   required maxlength="150">

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      rows="4" placeholder="Explain the issue..."
                      required maxlength="1000"></textarea>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Select category</option>
                <option value="Electrical">Electrical</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Cleanliness">Cleanliness</option>
                <option value="Food">Food</option>
                <option value="Furniture">Furniture</option>
                <option value="Other">Other</option>
            </select>

            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="LOW">Low</option>
                <option value="MEDIUM" selected>Medium</option>
                <option value="HIGH">High</option>
            </select>

            <button type="submit">Submit Complaint</button>
        </form>

        <a class="back" href="/">← Back to Home</a>
    </div>
</body>
</html>
