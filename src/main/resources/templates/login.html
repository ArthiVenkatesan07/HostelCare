
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelCare | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
            background:
                radial-gradient(ellipse at top left, #e0d0ff, transparent 45%),
                radial-gradient(ellipse at bottom right, #d9c4ff, transparent 40%),
                #f7f3ff;
            color: #38245f;
        }

        .login-wrapper {
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            overflow: hidden;
            background: white;
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(90, 55, 145, 0.18);
            animation: appear 0.65s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-panel {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px 38px 32px;
            overflow: hidden;
            background: linear-gradient(150deg, #f0e7ff, #e4d4ff 75%, #d7c0ff);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #6842aa;
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.8px;
        }

        .logo-icon {
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 17px;
            background: white;
            font-size: 29px;
            box-shadow: 0 7px 18px rgba(100, 65, 160, 0.12);
        }

        .logo span span {
            color: #a17ad8;
        }

        .tagline {
            margin-top: 5px;
            margin-left: 64px;
            color: #8066a9;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .welcome-text {
            margin-top: 52px;
        }

        .welcome-text h2 {
            margin-bottom: 14px;
            font-size: 31px;
            line-height: 1.25;
            color: #422d70;
        }

        .welcome-text p {
            max-width: 300px;
            color: #786795;
            font-size: 15px;
            line-height: 1.8;
        }

        .illustration {
            text-align: center;
            padding: 28px 0 15px;
            font-size: clamp(100px, 13vw, 155px);
            filter: drop-shadow(0 12px 14px rgba(112, 77, 164, 0.12));
        }

        .benefits {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 10px;
        }

        .benefit {
            flex: 1;
            text-align: center;
            color: #71549b;
            font-size: 12px;
        }

        .benefit-icon {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            margin: 0 auto 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.65);
            font-size: 18px;
        }

        .form-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 48px 54px;
            background: rgba(255,255,255,0.97);
        }

        .form-heading {
            margin-bottom: 30px;
        }

        .form-heading h1 {
            margin-bottom: 9px;
            color: #38245f;
            font-size: 37px;
            letter-spacing: -1px;
        }

        .form-heading p {
            color: #887b9b;
            font-size: 15px;
        }

        .error {
            margin-bottom: 18px;
            padding: 12px 14px;
            border: 1px solid #f4cccc;
            border-radius: 10px;
            background: #fff1f1;
            color: #b83232;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 20px 0 9px;
            color: #493663;
            font-size: 14px;
            font-weight: 700;
        }

        .field {
            position: relative;
        }

        .field-icon {
            position: absolute;
            top: 50%;
            left: 15px;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        input, select {
            width: 100%;
            min-height: 51px;
            padding: 13px 15px 13px 45px;
            border: 1px solid #ded2f1;
            border-radius: 12px;
            background: #fcfaff;
            color: #38245f;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s,
                        background 0.2s;
        }

        input::placeholder {
            color: #a59ab5;
        }

        input:focus, select:focus {
            border-color: #9870d2;
            background: white;
            box-shadow: 0 0 0 4px rgba(152,112,210,0.13);
        }

        select {
            cursor: pointer;
        }

        button {
            width: 100%;
            min-height: 53px;
            margin-top: 29px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(110deg, #b38ae8, #8c59cf 65%, #7041b9);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 9px 20px rgba(126, 78, 190, 0.24);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 13px 26px rgba(126, 78, 190, 0.32);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
            color: #a095b1;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e8e0f2;
        }

        .footer-note {
            margin-top: 17px;
            text-align: center;
            color: #9789aa;
            font-size: 12px;
        }

        @media (max-width: 760px) {
            body {
                padding: 18px;
            }

            .login-wrapper {
                grid-template-columns: 1fr;
                max-width: 470px;
            }

            .welcome-panel {
                padding: 28px 27px 23px;
            }

            .welcome-text {
                margin-top: 28px;
            }

            .welcome-text h2 {
                font-size: 25px;
            }

            .illustration {
                padding: 8px 0;
                font-size: 90px;
            }

            .benefits {
                margin-top: 5px;
            }

            .form-panel {
                padding: 32px 27px;
            }

            .form-heading h1 {
                font-size: 31px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="login-wrapper">

        <section class="welcome-panel">
            <div>
                <div class="logo">
                    <div class="logo-icon">🏡</div>
                    <span>Hostel<span>Care</span></span>
                </div>

                <p class="tagline">Safe Stays • Happier Days 💜</p>

                <div class="welcome-text">
                    <h2>Welcome Back!</h2>
                    <p>
                        Log in to your account and be a part
                        of a safer, smarter hostel experience.
                    </p>
                </div>

                <div class="illustration" aria-hidden="true">🏘️</div>
            </div>

            <div class="benefits">
                <div class="benefit">
                    <div class="benefit-icon">🛡️</div>
                    Safe
                </div>
                <div class="benefit">
                    <div class="benefit-icon">👥</div>
                    Supportive
                </div>
                <div class="benefit">
                    <div class="benefit-icon">💜</div>
                    Together
                </div>
            </div>
        </section>

        <section class="form-panel">
            <div class="form-heading">
                <h1>Login</h1>
                <p>Access your HostelCare account</p>
            </div>

            <p class="error"
               th:if="${error}"
               th:text="${error}"></p>

            <form action="/login" method="post">

                <label for="email">✉️ &nbsp; Email Address</label>
                <div class="field">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>

                <label for="password">🔒 &nbsp; Password</label>
                <div class="field">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <label for="role">👤 &nbsp; Login As</label>
                <div class="field">
                    <select id="role" name="role" required>
                        <option value="STUDENT">Student</option>
                        <option value="WARDEN">Warden</option>
                    </select>
                </div>

                <button type="submit">⇥ &nbsp; Login to HostelCare</button>
            </form>

            <div class="divider">Your comfort, our care</div>

            <p class="footer-note">
                Made for a better hostel experience 💜
            </p>
        </section>

    </main>
</body>
</html>
