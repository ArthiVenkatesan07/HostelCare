
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HostelCare | Feedback</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f7f2ff, #eee5ff);
            color: #35264d;
            min-height: 100vh;
            padding: 25px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 45px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #7851a9;
        }

        header a {
            text-decoration: none;
            color: #7851a9;
            font-weight: bold;
            margin-left: 18px;
        }

        .container {
            max-width: 520px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(120, 81, 169, 0.12);
        }

        .icon {
            width: 65px;
            height: 65px;
            display: grid;
            place-items: center;
            margin: 0 auto 18px;
            background: #f0e6ff;
            border-radius: 50%;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            color: #7851a9;
            margin-bottom: 12px;
        }

        .intro {
            text-align: center;
            color: #786b89;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .complaint {
            background: #f8f4ff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .complaint strong {
            display: block;
            margin-bottom: 7px;
            color: #7851a9;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 9px;
        }

        select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9c9ef;
            border-radius: 10px;
            margin-bottom: 22px;
            font: inherit;
            color: #35264d;
            background: white;
        }

        select:focus, textarea:focus {
            outline: 2px solid #b69add;
            border-color: #7851a9;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7851a9;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #62408e;
        }

        .note {
            text-align: center;
            color: #8a7c99;
            font-size: 13px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            .container {
                padding: 24px 20px;
            }

            header {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">💜 HostelCare</div>
        <nav>
            <a th:href="@{/student/complaints}">My Complaints</a>
            <a th:href="@{/logout}">Logout</a>
        </nav>
    </header>

    <main class="container">
        <div class="icon">⭐</div>

        <h1>Share Your Feedback</h1>
        <p class="intro">
            Your feedback helps us improve hostel services
            and provide a better experience for everyone.
        </p>

        <div class="complaint">
            <strong>Complaint</strong>
            <span th:text="${complaint.title}">Complaint title</span>
        </div>

        <form th:action="@{/complaints/feedback}" method="post">
            <input type="hidden" name="id" th:value="${complaint.id}">

            <label for="rating">Rate the resolution</label>
            <select id="rating" name="rating" required>
                <option value="">Choose a rating</option>
                <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
                <option value="4">⭐⭐⭐⭐ - Good</option>
                <option value="3">⭐⭐⭐ - Average</option>
                <option value="2">⭐⭐ - Poor</option>
                <option value="1">⭐ - Very Poor</option>
            </select>

            <label for="comment">Your comments (optional)</label>
            <textarea
                id="comment"
                name="comment"
                rows="4"
                maxlength="500"
                placeholder="Tell us about your experience..."></textarea>

            <button type="submit">Submit Feedback 💜</button>
        </form>

        <p class="note">
            Thank you for helping us make HostelCare better!
        </p>
    </main>
</body>
</html>
